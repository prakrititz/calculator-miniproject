spring.application.name=calculator-miniproject
server.port=8080

# Expose only the actuator endpoints we need (health + info)
management.endpoints.web.exposure.include=health,info

# Show details (disk space, ping) in the health response - handy for the demo
management.endpoint.health.show-details=always

# Adds /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true

# App details shown at /actuator/info
management.info.env.enabled=true
info.app.name=Calculator Mini Project
info.app.description=Spring Boot calculator REST API with a Jenkins CI/CD pipeline
info.app.course=CSE 816 Software Production Engineering

# Include the error message in error responses
server.error.include-message=always
server.error.include-stacktrace=never
