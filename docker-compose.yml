services:
  calculator:
    image: calculator-miniproject:1.0
    container_name: calculator
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
    expose:
      - "8080"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
